[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "classical-scientific-studies"
version = "0.1.0"
description = "Reproducible classical optimization, numerical methods and learning studies"
requires-python = ">=3.11,<3.12"
dependencies = ["numpy==2.3.4", "scipy==1.16.3", "matplotlib==3.10.7"]

[project.optional-dependencies]
allocation = ["dimod==0.12.21", "dwave-neal==0.6.0", "dwave-samplers==1.9.0", "networkx==3.6.1", "pandas==2.3.3"]
learning = ["pandas==2.3.3", "scikit-learn==1.7.2"]
notebooks = ["nbformat==5.10.4", "nbclient==0.10.2", "ipykernel==7.1.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"classical_studies.baselines" = ["provenance.json"]
"classical_studies.baselines.allocation" = ["config.json", "data/*"]
"classical_studies.baselines.forecasting" = ["protocol.json", "data/*"]
